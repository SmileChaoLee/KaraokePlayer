def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}

def getSecretProperty = { String key ->
    println("System.getenv(key) = ${System.getenv(key)}")
    def value = System.getenv(key) ?: findProperty(key) ?: localProperties.getProperty(key)
    if (value != null) {
        value = value.trim()
        if ((value.startsWith('"') && value.endsWith('"')) || (value.startsWith("'") && value.endsWith("'"))) {
            value = value.substring(1, value.length() - 1)
        }
    }
    return value
}

android {

    signingConfigs {
        release {
            // Keystore credentials come from environment, gradle.properties, or local.properties
            def storeFilePath = getSecretProperty("NEW_KEYSTORE_FILE")
            def storeFileObj = storeFilePath ? file(storeFilePath) : null
            if (storeFileObj != null && storeFileObj.exists()) {
                storeFile storeFileObj
                storePassword getSecretProperty("NEW_KEYSTORE_PASSWORD")
                keyAlias getSecretProperty("NEW_KEY_ALIAS")
                keyPassword getSecretProperty("NEW_KEY_PASSWORD")
            }
        }
    }

    compileSdk = sdk_version.compile

    // Force Gradle to use your healthy NDK 27 installation
    ndkVersion '27.3.13750724'

    defaultConfig {
        targetSdk sdk_version.target
        minSdk sdk_version.min
        versionCode 1026
        versionName "10.26"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // Configure native CMake build for video player flavors AND during IDE sync.
    // Enable for any real build (assemble/bundle) so the videoplayer and
    // karaoketvplayer APKs contain the native .so, even when built without an
    // explicit flavor selector (e.g. `./gradlew assembleRelease`).
    boolean isIdeSync = Boolean.parseBoolean(
            findProperty("android.injected.build.model.only")?.toString())
    boolean isVideoTask = gradle.startParameter.taskNames.any { task ->
        task.containsIgnoreCase("videoplayer") || task.containsIgnoreCase("karaoketvplayer")
    }
    boolean isBuildTask = gradle.startParameter.taskNames.any { task ->
        task.containsIgnoreCase("assemble") || task.containsIgnoreCase("bundle")
    }
    if (isIdeSync || isVideoTask || isBuildTask) {
        externalNativeBuild {
            cmake {
                path file('src/videoplayer/jni/CMakeLists.txt')
                version '3.22.1'
            }
        }
    }

    flavorDimensions += ["karaoke"]
    productFlavors {
        register("karaokeplayer") {
            dimension = "karaoke"
            applicationId = "com.smile.karaokeplayer"
        }
        register("karaokeplayer2") {
            // for Amazon app store only
            // has same package name with "karaokeplayer"
            dimension = "karaoke"
            applicationId = "com.smile.karaokeplayer"
        }
        register("videoplayer") {
            dimension = "karaoke"
            applicationId = "com.smile.videoplayer"
        }
        register("videoplayer2") {
            // for Amazon app store only
            // has same package name with "videoplayer"
            dimension = "karaoke"
            applicationId = "com.smile.videoplayer"
        }
        register("karaoketvplayer") {
            dimension = "karaoke"
            applicationId = "com.smile.karaoketvplayer"
            isDefault = true
        }
        register("u2bplayer") {
            dimension = "karaoke"
            versionCode 129
            versionName "1.29"
            applicationId = "com.smile.u2bplayer"
        }
        register("u2bplayer2") {
            // for Amazon app store only
            dimension = "karaoke"
            versionCode 129
            versionName "1.29"
            applicationId = "com.smile.youtubeplayer"
        }
        register("u2bkaraoke") {
            dimension = "karaoke"
            versionCode 118
            versionName "1.18"
            applicationId = "com.smile.u2bkaraoke"
        }
        register("u2bkktool") {
            dimension = "karaoke"
            versionCode 103
            versionName "1.03"
            applicationId = "com.smile.u2bkktool"
        }
        register("u2bkktool2") {
            // for Amazon app store only
            dimension = "karaoke"
            versionCode 103
            versionName "1.03"
            applicationId = "com.smile.u2bkktool2"
        }
    }

    sourceSets {
        main {
            java.srcDir("src/main/java")
            resources.srcDir("src/main/rec")
            manifest {
                srcFile "src/main/AndroidManifest.xml"
            }
        }

        karaokeplayer {
            java.srcDirs += ["src/karaokeplayer/java"]
            res.srcDirs += ["src/karaokeplayer/res"]
            manifest {
                srcFile "src/karaokeplayer/AndroidManifest.xml"
            }
        }

        karaokeplayer2 {
            java.srcDirs += ["src/karaokeplayer2/java", "src/karaokeplayer/java"]
            res.srcDirs += ["src/karaokeplayer/res"]
            manifest {
                srcFile "src/karaokeplayer2/AndroidManifest.xml"
            }
        }

        videoplayer {
            java.srcDirs += ["src/videoplayer/java"]
            res.srcDirs += ["src/videoplayer/res"]
            manifest {
                srcFile "src/videoplayer/AndroidManifest.xml"
            }
        }

        videoplayer2 {
            java.srcDirs += ["src/videoplayer2/java", "src/videoplayer/java"]
            res.srcDirs += ["src/videoplayer/res"]
            manifest {
                srcFile "src/videoplayer2/AndroidManifest.xml"
            }
        }

        karaoketvplayer {
            java.srcDirs += ["src/karaoketvplayer/java", "src/karaokeplayer/java",
                             "src/videoplayer/java", "src/u2bplayer/java",
                             "src/u2bkaraoke/java"]
            res.srcDirs += ["src/karaoketvplayer/res", "src/karaokeplayer/res",
                            "src/videoplayer/res", "src/u2bplayer/res",
                            "src/u2bkaraoke/res"]
            manifest {
                srcFile "src/karaoketvplayer/AndroidManifest.xml"
            }
        }

        u2bplayer {
            java.srcDirs += ["src/u2bplayer/java"]
            res.srcDirs += ["src/u2bplayer/res"]
            manifest {
                srcFile "src/u2bplayer/AndroidManifest.xml"
            }
        }

        u2bplayer2 {
            // for Amazon app store only
            java.srcDirs += ["src/u2bplayer2/java", "src/u2bplayer/java"]
            res.srcDirs += ["src/u2bplayer/res"]
            manifest {
                srcFile "src/u2bplayer2/AndroidManifest.xml"
            }
        }

        u2bkaraoke {
            java.srcDirs += ["src/u2bkaraoke/java", "src/u2bplayer/java"]
            res.srcDirs += ["src/u2bkaraoke/res", "src/u2bplayer/res"]
            manifest {
                srcFile "src/u2bkaraoke/AndroidManifest.xml"
            }
        }

        u2bkktool {
            java.srcDirs += ["src/u2bkktool/java", "src/u2bkaraoke/java",
                             "src/u2bplayer/java"]
            res.srcDirs += ["src/u2bkktool/res", "src/u2bkaraoke/res",
                            "src/u2bplayer/res"]
            manifest {
                srcFile "src/u2bkktool/AndroidManifest.xml"
            }
        }
        u2bkktool2 {
            java.srcDirs += ["src/u2bkktool/java", "src/u2bkaraoke/java",
                             "src/u2bplayer/java"]
            res.srcDirs += ["src/u2bkktool2/res", "src/u2bkaraoke/res",
                            "src/u2bplayer/res"]
            manifest {
                srcFile "src/u2bkktool/AndroidManifest.xml"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
        }
        debug {
            minifyEnabled false
            // shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures  {
        viewBinding true
        dataBinding true
        buildConfig true
        compose true
    }

    room {
        schemaDirectory "$projectDir/schemas"
    }

    namespace 'com.smile.karaoke'
}

allprojects {
    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs << "-Xlint:unchecked" << "-Xlint:deprecation"
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation libs.appcompat
    implementation libs.constraintlayout
    implementation libs.core.ktx
    implementation libs.lifecycle.extensions
    implementation libs.annotation
    implementation libs.firebase.core
    implementation libs.firebase.ads
    implementation libs.material
    implementation libs.recyclerview
    implementation libs.ump

    implementation platform(libs.compose.bom)
    implementation libs.compose.runtime
    implementation libs.compose.ui
    implementation libs.compose.material3
    implementation libs.compose.ui.tooling.preview
    implementation libs.activity.ktx
    implementation libs.fragment.ktx
    implementation libs.lifecycle.runtime.ktx
    implementation libs.activity.compose
    implementation libs.compose.ui.graphics
    implementation libs.mediarouter
    implementation libs.media3.cast

    implementation libs.billing

    implementation libs.tracing.perfetto
    implementation libs.nanohttpd

    implementation files('libs/smilelibraries-release.aar')
    implementation files('libs/NativeTemplatesModels-release.aar')

    // ... other dependencies
    implementation libs.retrofit
    implementation libs.retrofit.converter.gson
    implementation libs.okhttp.logging.interceptor
    implementation libs.coroutines.android
    implementation libs.retrofit.coroutines.adapter

    implementation libs.coil

    implementation libs.room.ktx
    ksp libs.room.compiler
    implementation libs.room.runtime

    implementation libs.dagger
    ksp libs.dagger.android.processor
    ksp libs.dagger.compiler

    // This block runs after the project is configured
    afterEvaluate {
        android.applicationVariants.all { variant ->
            variant.productFlavors.each { flavor ->
                if (flavor.name.containsIgnoreCase("karaoke")) {
                    dependencies.add(variant.name + "Implementation", libs.media3.exoplayer)
                    dependencies.add(variant.name + "Implementation", libs.media3.exoplayer.dash)
                    dependencies.add(variant.name + "Implementation", libs.media3.decoder)
                    dependencies.add(variant.name + "Implementation", libs.media3.ui)
                    dependencies.add(variant.name + "Implementation", libs.media3.session)
                    dependencies.add(variant.name + "Implementation", project(":extension-ffmpeg"))
                    dependencies.add(variant.name + "Implementation", project(":extension-flac"))
                    dependencies.add(variant.name + "Implementation", project(":extension-opus"))
                    dependencies.add(variant.name + "Implementation", project(":extension-av1"))
                }
                if (flavor.name.containsIgnoreCase("karaoketvplayer")
                        || flavor.name.containsIgnoreCase("u2bplayer")
                        || flavor.name.containsIgnoreCase("u2bkaraoke")
                        || flavor.name.containsIgnoreCase("u2bkktool")) {
                    dependencies.add(variant.name + "Implementation",
                            libs.youtube.core)
                    dependencies.add(variant.name + "Implementation",
                            libs.youtube.custom.ui)
                    dependencies.add(variant.name + "Implementation",
                        libs.youtube.chromecast.sender)
                }
                if (flavor.name.containsIgnoreCase("videoplayer")   // includes videoplayer2
                        || flavor.name.containsIgnoreCase("karaoketvplayer")) {
                    dependencies.add(variant.name + "Implementation", libs.libvlc)
                }
            }
        }
    }

    debugImplementation libs.compose.ui.tooling
    debugImplementation libs.compose.test.manifest
    testImplementation libs.junit
    testImplementation libs.room.testing
    androidTestImplementation platform(libs.compose.bom)
    androidTestImplementation libs.compose.ui.test.junit4
    androidTestImplementation libs.androidx.test.junit
    androidTestImplementation libs.androidx.test.rules
    androidTestImplementation libs.androidx.test.truth
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.uiautomator
}

apply plugin: 'com.google.gms.google-services'
